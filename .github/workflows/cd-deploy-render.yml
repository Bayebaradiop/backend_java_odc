name: CD — Deploy to Render

on:
  workflow_run:
    workflows: ["CI — Build & Test"]
    types: [ completed ]
    branches: [ lydevtech ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Condition : exécuter seulement si le workflow CI réussit
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      # Étape 1 : Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v4

      # Étape 2 : Configurer Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Étape 3 : Se connecter à Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Étape 4 : Construire et pousser l'image Docker vers Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/medibook-api:latest

      # Étape 5 : Déclencher le déploiement sur Render
      - name: Trigger Render Deploy
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": true}'

      # Étape 6 : Confirmation
      - name: Deployment triggered
        run: |
          echo "✅ Image Docker poussée vers Docker Hub: ${{ secrets.DOCKERHUB_USERNAME }}/medibook-api:latest"
          echo "✅ Déclenchement du déploiement Render effectué avec succès  !"