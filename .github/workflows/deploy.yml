name: Deploy MediBook to Azure

on:
  push:
    branches: [ lydevtech ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Se connecter à Azure
      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 3. Se connecter à ACR
      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: medibookregistry.azurecr.io
          username: medibookregistry
          password: ${{ secrets.ACR_PASSWORD }}

      # 4. Builder et pousser l'image Docker
      - name: Build and Push Docker image
        run: |
          docker build -t medibookregistry.azurecr.io/medibook:latest .
          docker build -t medibookregistry.azurecr.io/medibook:${{ github.sha }} .
          docker push medibookregistry.azurecr.io/medibook:latest
          docker push medibookregistry.azurecr.io/medibook:${{ github.sha }}

      # 5. Déployer sur Azure Container Apps
      - name: Deploy to Azure Container Apps
        run: |
          az extension add --name containerapp --upgrade -y
          az containerapp update \
            --name medibook-app \
            --resource-group medibook-rg \
            --image medibookregistry.azurecr.io/medibook:${{ github.sha }}

      # 6. Afficher l'URL de déploiement
      - name: Show deployment URL
        run: |
          echo "✅ Déploiement terminé !"
          echo "🌐 URL: https://medibook-app.ashyforest-850fd289.spaincentral.azurecontainerapps.io"
          echo "📋 Swagger: https://medibook-app.ashyforest-850fd289.spaincentral.azurecontainerapps.io/swagger-ui.html"