name: CI — Build & Test

on:
  push:
    branches: [ lydevtech, develop ]
  pull_request:
    branches: [ lydevtech ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : Récupérer le code source depuis GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # Étape 2 : Configurer JDK 17 avec caching Maven
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # Étape 3 : Compiler et exécuter les tests
      - name: Build and test
        run: mvn clean package

      # Étape 4 : Upload de l'artéfact (JAR) pour le CD
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 1