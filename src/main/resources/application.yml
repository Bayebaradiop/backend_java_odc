spring:
  application:
    name: medibook-api
  profiles:
    active: dev

  # Base de données
  datasource:
    url: jdbc:postgresql://localhost:5432/medibook
    username: postgres
    password: passer
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8085

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  show-actuator: false

jwt:
  secret: ${JWT_SECRET:medibook-secret-key-change-in-production}
  expiration: 86400000