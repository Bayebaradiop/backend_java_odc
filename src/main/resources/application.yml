spring:
  application:
    name: medibook-api
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:dpg-d72rf4c2kvos7382prng-a}:${DB_PORT:5432}/${DB_NAME:medibook_9tzd}
    username: ${DB_USERNAME:medibook_9tzd_user}
    password: ${DB_PASSWORD:M1RKm7TlXd88JRLHeEG9smrAG0fSIiYv}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: true
  flyway:
    enabled: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

# ⚠️ management doit être au niveau racine, PAS sous spring:
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  show-actuator: false

jwt:
  secret: ${JWT_SECRET:medibook-secret-key-change-in-production}
  expiration: 86400000

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

brevo:
  api-key: ${BREVO_API_KEY}
  sender-email: ${BREVO_SENDER_EMAIL}
  sender-name: ${BREVO_SENDER_NAME}

app:
  front-url: https://app.medibook.com